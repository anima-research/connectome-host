name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.os }}, Node ${{ matrix.node }}, Bun ${{ matrix.bun }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # npm 10.9.0, which Node 22.12.0 ships, regenerating a package-lock.json
      # over an existing node_modules tree records only that machine's native
      # binaries (esbuild, rollup, tailwind's oxide), so a lock made on macOS
      # breaks Linux installs and vice versa. Each Node line ships its own
      # built-in fetch (undici).
      matrix:
        include:
          - { os: ubuntu-latest, node: '22.12.0', bun: '1.4.3' }
          - { os: ubuntu-latest, node: '24', bun: latest }
          - { os: ubuntu-latest, node: latest, bun: latest }
          - { os: macos-latest, node: '22.12.0', bun: '1.4.3' }
          - { os: macos-latest, node: latest, bun: latest }

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ matrix.node }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ matrix.bun }}

      # npm ci never rewrites package-lock.json, and fails when the lock
      # doesn't match package.json or lacks a package this platform needs,
      # where npm 11's `npm install` re-resolves it silently.
      - name: Install dependencies (strict lockfile)
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Build web assets (strict lockfile)
        run: npm run build:web:ci

      - name: Test
        if: matrix.os == 'ubuntu-latest'
        run: npm test

  # bun runs TypeScript without checking its types, and `vite build`
  # doesn't check them either. isolatedModules has the host's check also
  # reject what bun can't transpile one module at a time: a type-only name
  # re-exported without `export type`, for one, passes the rest of the
  # check and fails when bun loads the module.
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22.12.0'

      - name: Install dependencies (strict lockfile)
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm ci --prefix web --ignore-scripts --no-audit --no-fund

      - name: Typecheck the host's source
        run: npx tsc --noEmit

      - name: Typecheck the web app
        working-directory: web
        run: npx tsc --noEmit

  # The packed release installs its dependencies from the registry as it
  # stands, not from this branch's lockfile, so a new upstream release can
  # turn this job red on a change that touched nothing it installs: when it
  # fails, rerunning it on main tells a change's own break from the
  # registry's drift.
  pack-check:
    name: Packed release installs on its own
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3

      - name: Build web assets
        run: npm run build:web:ci

      - name: Packed release installs on its own
        run: node scripts/pack-installs-alone.mjs

  lockfiles:
    name: Lockfiles agree
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3

      # Frozen, bun refuses to install when package.json asks for anything
      # bun.lock doesn't pin.
      - name: bun.lock matches package.json
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Both lockfiles resolve the @animalabs packages the same way
        run: node scripts/lockfiles-agree.mjs

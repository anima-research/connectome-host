name: Build & Publish

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    # issues: read lets the release-hold check list the open holds.
    permissions:
      contents: read
      issues: read

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24

      # The same check `npm version` runs first (see CONTRIBUTING.md): an
      # open issue labelled release-hold stops the release. Both jobs that
      # release need this one and check again themselves, each when it
      # runs, so a hold open at this check stops both. A dispatch on a
      # branch releases nothing, so it isn't held.
      - name: Release holds
        if: startsWith(github.ref, 'refs/tags/v')
        run: node scripts/release-holds.mjs
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3

      # npm ci, as in ci.yml: a tag doesn't wait for CI, and npm ci installs
      # what package-lock.json pins, where `npm install` would re-resolve it.
      # --ignore-scripts, as in ci.yml too: the root postinstall's non-strict
      # `npm --prefix web install` would heal a broken web/package-lock.json
      # on disk before the strict step below reads it.
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Build web assets
        run: npm run build:web:ci

      - name: Test
        run: npm test

  # Builds the Web UI, then checks the tarball npm publish makes from this
  # tree with it, installed alone into an empty directory with its
  # dependencies from npm and no install scripts run, as npm 12 and bun
  # install, then run there (see scripts/pack-installs-alone.mjs): the
  # package carries the Web UI, src/index.ts's static and literal dynamic
  # imports resolve (computed ones, such as recipe extensions, aside),
  # @opentui/core loads, and a smoke run of the README's offline recipe
  # answers, with the Web UI off and a queued reply. Then it hands the Web
  # UI it checked to the publish job, which packs it with the tree. A job of
  # its own, so the install scripts the Web UI's build runs never see the
  # publish job's id-token; publish needs it, the GitHub release notes
  # don't. It runs on a dispatch from a branch too, which publishes nothing.
  # Its limit is above the script's own, which add up to 73 minutes at
  # most, so a hang outside them ends here, not at GitHub's 6 hours.
  pack-check:
    name: Packed release installs on its own
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24

      # bun runs the host.
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3

      # The Web UI's dependencies from web/package-lock.json, their install
      # scripts included, then its build into dist/web.
      - name: Build web assets
        run: npm run build:web:ci

      - name: Packed release installs on its own
        run: node scripts/pack-installs-alone.mjs

      # Every file of it, dotfiles too, as npm packed it, and replacing the
      # one an earlier attempt of this run uploaded, so a re-run can upload.
      - name: Hand the checked Web UI to publish
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-ui
          path: dist/web
          if-no-files-found: error
          include-hidden-files: true
          overwrite: true

  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: [build-and-test, pack-check]
    if: startsWith(github.ref, 'refs/tags/v')

    # OIDC trusted publishing: GitHub mints a short-lived id-token, npm CLI
    # exchanges it for a publish credential. No long-lived NPM_TOKEN secret.
    # npm-side config: npmjs.com -> package -> Settings -> Trusted Publishers
    # -> GitHub Actions, matching the repo + this workflow path.
    # issues: read lets prepublishOnly's release-hold check list the holds.
    permissions:
      contents: read
      id-token: write
      issues: read

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Require changelog section for this release
        run: |
          ver="${GITHUB_REF_NAME#v}"
          esc=$(printf '%s' "$ver" | sed 's/[.]/\\./g')
          if ! grep -Eq "^## ${esc}([^0-9]|$)" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## ${ver}' section for tag ${GITHUB_REF_NAME}. Retitle the Unreleased section before tagging (see CONTRIBUTING.md)."
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          # node 24 ships npm >= 11.5.1, required for OIDC publishing.
          node-version: 24
          registry-url: https://registry.npmjs.org

      # The Web UI this run's pack-check job built and checked, which
      # package.json's files packs with the tree. Nothing is installed or
      # built here, so no dependency's install script runs where the
      # id-token is. prepublishOnly checks the release holds, and prepack,
      # which needs only node and git, refuses a tree without the Web UI or
      # one that would pack a file git ignores.
      - name: Take the checked Web UI
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-ui
          path: dist/web

      - name: Publish
        run: npm publish --access public --provenance
        env:
          # prepublishOnly checks the release holds again, as the build job
          # did, with the same token.
          GH_TOKEN: ${{ github.token }}

  github-release:
    name: GitHub release notes
    runs-on: ubuntu-latest
    needs: build-and-test
    # Deliberately independent of the npm publish job: some consumers run
    # github-clone checkouts, and release notes must exist even when npm
    # publish fails — the two jobs succeed or fail on their own. Both need
    # the build job, so a failed build stops both; past it, so do a tag with
    # no changelog section, which neither can release, and an open release
    # hold, which each checks.
    if: startsWith(github.ref, 'refs/tags/v')

    # issues: read lets the release-hold check list the holds.
    permissions:
      contents: write
      issues: read

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24

      # Checked again here, as prepublishOnly checks it again in the
      # publish job, each when its job reaches it: a hold filed after the
      # build job's check stops whichever of the two checks after it. A
      # hold filed between the two checks can stop one and not the other.
      - name: Release holds
        run: node scripts/release-holds.mjs
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Mirror changelog section into release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ver="${GITHUB_REF_NAME#v}"
          # Section header is '## X.Y.Z — YYYY-MM-DD'; match the version
          # field exactly (string compare, no regex escaping needed).
          awk -v ver="$ver" '
            /^## / { if (in_section) exit; if ($2 == ver) { in_section = 1; next } }
            in_section { print }
          ' CHANGELOG.md | sed '/./,$!d' > notes.md
          if ! [ -s notes.md ]; then
            echo "::error::No CHANGELOG.md section found for ${ver}."
            exit 1
          fi
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --notes-file notes.md
          else
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" \
              --notes-file notes.md --verify-tag
          fi

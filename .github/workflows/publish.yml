name: Build & Publish

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    # issues: read lets the release-hold check list the open holds.
    permissions:
      contents: read
      issues: read

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24

      - name: Release holds
        if: startsWith(github.ref, 'refs/tags/v')
        run: node scripts/release-holds.mjs
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3

      # npm ci installs what package-lock.json pins, where npm 11's
      # `npm install` would re-resolve it.
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Build web assets
        run: npm run build:web:ci

      - name: Test
        run: bash scripts/test-on-tmpfs.sh

  pack-check:
    name: Packed release installs on its own
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3

      - name: Build web assets
        run: npm run build:web:ci

      - name: Packed release installs on its own
        run: node scripts/pack-installs-alone.mjs

      # upload-artifact leaves out hidden files unless include-hidden-files is
      # set, and fails when the run already holds an artifact of this name,
      # as after an earlier attempt, unless overwrite is set.
      - name: Hand the checked Web UI to publish
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-ui
          path: dist/web
          if-no-files-found: error
          include-hidden-files: true
          overwrite: true

  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: [build-and-test, pack-check]
    if: startsWith(github.ref, 'refs/tags/v')

    # OIDC trusted publishing: GitHub mints a short-lived id-token, npm CLI
    # exchanges it for a publish credential. No long-lived NPM_TOKEN secret.
    # npm-side config: npmjs.com -> package -> Settings -> Trusted Publisher
    # -> GitHub Actions, matching the repo + this workflow's filename.
    # issues: read lets prepublishOnly's release-hold check list the holds.
    permissions:
      contents: read
      id-token: write
      issues: read

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Require changelog section for this release
        run: |
          ver="${GITHUB_REF_NAME#v}"
          esc=$(printf '%s' "$ver" | sed 's/[.]/\\./g')
          if ! grep -Eq "^## ${esc}([^0-9]|$)" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## ${ver}' section for tag ${GITHUB_REF_NAME}. Retitle the Unreleased section before tagging (see CONTRIBUTING.md)."
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          # OIDC publishing needs npm 11.5.1 or later, which Node ships
          # from 24.5.0.
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Nothing is installed or built in this job: any process a step runs
      # can request the OIDC token, so a dependency's install script here
      # could mint a publish credential.
      - name: Take the checked Web UI
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-ui
          path: dist/web

      - name: Publish
        run: npm publish --access public --provenance
        env:
          # npm publish runs prepublishOnly, whose release-hold check reads
          # this token.
          GH_TOKEN: ${{ github.token }}

  github-release:
    name: GitHub release notes
    runs-on: ubuntu-latest
    needs: build-and-test
    if: startsWith(github.ref, 'refs/tags/v')

    # issues: read lets the release-hold check list the holds.
    permissions:
      contents: write
      issues: read

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24

      - name: Release holds
        run: node scripts/release-holds.mjs
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Mirror changelog section into release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ver="${GITHUB_REF_NAME#v}"
          awk -v ver="$ver" '
            /^## / { if (in_section) exit; if ($2 == ver) { in_section = 1; next } }
            in_section { print }
          ' CHANGELOG.md | sed '/./,$!d' > notes.md
          if ! [ -s notes.md ]; then
            echo "::error::No CHANGELOG.md section found for ${ver}."
            exit 1
          fi
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --notes-file notes.md
          else
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" \
              --notes-file notes.md --verify-tag
          fi

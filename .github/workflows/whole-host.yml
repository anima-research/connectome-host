name: Whole-host runs

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  whole-host:
    name: Whole-host runs (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.4'

      - name: Install dependencies (strict lockfile)
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Whole-host runs
        run: node test/whole-host/run.mjs --shard ${{ matrix.shard }}/4 --out whole-host-out

      - name: Keep the runs' evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: whole-host-${{ matrix.shard }}
          path: whole-host-out
          if-no-files-found: ignore

  unit:
    name: Whole-host harness unit tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.4'

      - name: Install dependencies (strict lockfile)
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Unit tests
        run: node --test test/whole-host/unit/*.unit.mjs
